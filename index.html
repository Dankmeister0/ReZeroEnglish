<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151517" />
    <meta
      name="description"
      content="A focused, offline-friendly reader for the translated Re:ZERO web novel."
    />
    <title>re:read zero</title>
    <link rel="icon" type="image/png" sizes="180x180" href="img/arc10.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/arc10.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-progress" aria-hidden="true"><span id="pageProgress"></span></div>

    <aside class="library-panel" id="libraryPanel" aria-label="Chapter library">
      <div class="library-top">
        <a class="wordmark" href="./" aria-label="re:read zero home">
          <span>re:<i>read</i></span>
          <small>ZERO</small>
        </a>
        <button class="icon-button close-library" id="closeLibrary" aria-label="Close chapter library">
          <span></span><span></span>
        </button>
      </div>

      <section class="library-intro" aria-label="Library status">
        <p class="eyebrow">TRANSLATED WEB NOVEL</p>
        <p class="library-count"><strong>818</strong> chapters in your library</p>
        <div class="library-reading-position">
          <span id="libraryPosition">Start reading</span>
          <span id="libraryPercentage">0%</span>
        </div>
        <div class="mini-progress" aria-hidden="true"><span id="libraryProgress"></span></div>
      </section>

      <label class="chapter-search">
        <span class="sr-only">Find a chapter</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 20-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
        <input id="chapterSearch" type="search" placeholder="Go to a chapter…" autocomplete="off" />
      </label>

      <nav class="chapter-list" id="chapterList" aria-label="Chapters"></nav>

      <div class="library-footer">
        <span class="status-dot"></span>
        Progress is saved on this device
      </div>
    </aside>

    <div class="panel-scrim" id="panelScrim" aria-hidden="true"></div>

    <main>
      <header class="site-header">
        <button class="menu-button" id="openLibrary" aria-controls="libraryPanel" aria-expanded="false">
          <span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
          <span>Library</span>
        </button>
        <a class="mobile-wordmark" href="./" aria-label="re:read zero">re:<i>read</i></a>
        <div class="reader-tools">
          <div class="font-size-tools" aria-label="Text size">
            <button id="decreaseText" aria-label="Decrease text size">A<span>−</span></button>
            <button id="increaseText" aria-label="Increase text size">A<span>+</span></button>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="Switch color theme" title="Switch color theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.1A8.5 8.5 0 0 1 8.9 3.3 8.5 8.5 0 1 0 20.7 15.1Z" /></svg>
          </button>
        </div>
      </header>

      <section class="reader-shell" aria-live="polite">
        <div class="chapter-utilities">
          <span class="chapter-index" id="chapterIndex">CHAPTER 1 OF 818</span>
          <button class="save-button" id="saveButton">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h12v16.5l-6-3.7-6 3.7V3.75Z" /></svg>
            <span>Save place</span>
          </button>
        </div>

        <header class="chapter-heading">
          <p class="arc-label" id="arcLabel">ARC 1</p>
          <h1 id="chapterTitle">Preparing your chapter</h1>
          <p class="chapter-subtitle" id="chapterSubtitle">The Lingering Heat of the Beginning</p>
        </header>

        <article class="chapter-content" id="chapterContent" aria-busy="true">
          <div class="reader-loading"><span></span><p>Opening the book…</p></div>
        </article>

        <nav class="chapter-pagination" aria-label="Chapter navigation">
          <button class="chapter-nav previous" id="previousChapter">
            <span class="nav-arrow" aria-hidden="true">←</span>
            <span><small>PREVIOUS</small><strong id="previousLabel">Chapter</strong></span>
          </button>
          <button class="chapter-nav next" id="nextChapter">
            <span><small>NEXT</small><strong id="nextLabel">Chapter</strong></span>
            <span class="nav-arrow" aria-hidden="true">→</span>
          </button>
        </nav>
      </section>

      <footer class="reader-footer">
        <span id="saveStatus">Your place is saved automatically.</span>
        <button id="backToTop">Back to top ↑</button>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
